<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIMB Fest 2026</title>

</head>
<body>

    <section>
    <h2> Register for the event </h2>
    <form action="/register">
        <label for="name">name:</label>
        <input type="text" name="Name" id="name" required minlength="2" maxlength="15">
        <br><br>
        <label for="email">Student's Email:</label>
        <input type="email" name="Email" id="email" required>
        <br><br>
        <label for="T-shirt size">Student's T-shirt size:</label>
        <select name="T-shirt size" required>
            <option value="--please select the size--">Select T-shirt size</option>
            <option value="36">36</option>
            <option value="38">38</option>
            <option value="40">40</option>
            <option value="42">42</option>
        </select>
        <br><br>
        <label for="checkbox1" >  </label>
        <input type="checkbox" id="checkbox1" name="checkbox1" > I agree to the terms and conditions<br><br>

      
        <input type="radio" name="Attendee_type" value="Alumni" required> 
          <label for="Alumni">Alumni</label>
       
        <input type="radio" name="Attendee_type" value="student" required>
         <label for="student">Student</label><br><br>

        <button type="submit">Register</button><br><br>
    </form><br><br>
    <a href="index.html">Back to home page</a>
    </section>
    
</body>
</html>
